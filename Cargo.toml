[workspace]
resolver = "3"
members = ["crates/idx-core", "crates/idx-cli", "crates/idx-mcp"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/0xrsydn/idx-cli"
homepage = "https://github.com/0xrsydn/idx-cli"

[workspace.dependencies]
idx-core = { path = "crates/idx-core", version = "=0.3.1" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3", features = ["json", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled-full"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
