repos:
  - repo: builtin
    hooks:
      # Golden files pin exact CLI output, including trailing spaces.
      - id: trailing-whitespace
        exclude: ^tests/golden/.*\.golden$
      - id: end-of-file-fixer
        exclude: ^tests/golden/.*\.golden$
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check -L
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
