repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check -L
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
