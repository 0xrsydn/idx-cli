[package]
name = "idx-cli"
description = "CLI tool for Indonesian stock market (IDX) analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["idx", "stocks", "indonesia", "cli", "finance"]
categories = ["command-line-utilities", "finance"]
include = ["/Cargo.toml", "/LICENSE", "/src/**"]

[[bin]]
name = "idx"
path = "src/main.rs"

[features]
default = ["ownership"]
# rusqlite/sha2/ureq back ownership import code that phase 3 moves into idx-core.
ownership = ["idx-core/ownership", "dep:rusqlite", "dep:sha2", "dep:ureq"]

[dependencies]
idx-core = { workspace = true, features = ["clap"] }
clap.workspace = true
clap_complete = "4"
serde.workspace = true
serde_json.workspace = true
comfy-table = "7"
owo-colors = "4"
toml.workspace = true
chrono.workspace = true
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rusqlite.workspace = true
sha2.workspace = true
zip.workspace = true
