# Golden output cases for tests/golden.rs.
#
# Each case runs once per entry in `formats` (default: table and json) with
# `-o <format>` prepended; `formats = []` runs the args as given, which means
# the auto format: stdout is a pipe here, so auto resolves to compact JSON.
# Every run uses the mock provider (IDX_USE_MOCK_PROVIDER=1) and an isolated
# home directory. `ownership = true` seeds the fixture DB; `before` runs setup
# commands first; `stdin` is piped to the command.
#
# `idx version` is excluded on purpose: its output changes with every release.

# --- help and shell completions ---------------------------------------------

[[case]]
name = "help-root"
args = ["--help"]
formats = []

[[case]]
name = "help-stocks"
args = ["stocks", "--help"]
formats = []

[[case]]
name = "help-ownership"
args = ["ownership", "--help"]
formats = []

[[case]]
name = "help-config"
args = ["config", "--help"]
formats = []

[[case]]
name = "help-cache"
args = ["cache", "--help"]
formats = []

[[case]]
name = "completions-bash"
args = ["completions", "bash"]
formats = []

# --- config and cache ---------------------------------------------------------

[[case]]
name = "config-path"
args = ["config", "path"]
formats = []

[[case]]
name = "config-init"
args = ["config", "init"]
formats = []

[[case]]
name = "config-get"
args = ["config", "get", "general.provider"]
formats = []
before = [["config", "init"]]

[[case]]
name = "config-set"
args = ["config", "set", "general.provider", "yahoo"]
formats = []

[[case]]
name = "config-set-output-jsonl"
args = ["config", "set", "general.output", "jsonl"]
formats = []

[[case]]
name = "config-set-output-invalid"
args = ["config", "set", "general.output", "yaml"]
formats = []

[[case]]
name = "config-output-table-pins-format"
args = ["stocks", "quote", "BBCA"]
formats = []
before = [["config", "set", "general.output", "table"]]

[[case]]
name = "cache-info-empty"
args = ["cache", "info"]

[[case]]
name = "cache-clear"
args = ["cache", "clear"]

